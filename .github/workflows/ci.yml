name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        include:
          - build_type: Debug
            sanitizer_flags: "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
            test_label: "unit|contract"
          - build_type: Release
            sanitizer_flags: ""
            test_label: "unit|contract|integration"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            ${{ matrix.sanitizer_flags }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure -L "${{ matrix.test_label }}" --timeout 60

  install-verify:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libssl-dev

      - name: Build and install
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          cmake --install build --prefix ./_install

      - name: Verify find_package consumption
        run: |
          cat > /tmp/consumer.cpp << 'EOF'
          #include "mini/net/EventLoop.h"
          #include "mini/net/TcpServer.h"
          int main() {
              mini::net::EventLoop loop;
              mini::net::InetAddress addr(0, true);
              mini::net::TcpServer server(&loop, addr, "verify");
              return 0;
          }
          EOF

          cat > /tmp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          find_package(mini_trantor CONFIG REQUIRED)
          add_executable(consumer /tmp/consumer.cpp)
          target_link_libraries(consumer PRIVATE mini_trantor::mini_trantor)
          EOF

          cmake -S /tmp -B /tmp/build_consumer \
            -DCMAKE_PREFIX_PATH=$PWD/_install \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/build_consumer -j$(nproc)
          echo "Install verification: PASS"
