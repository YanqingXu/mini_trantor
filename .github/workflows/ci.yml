name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  gcc-debug-asan-ubsan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DMINI_ENABLE_ASAN_UBSAN=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure -L "unit|contract" --timeout 60

  gcc-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure -L "unit|contract|integration" --timeout 90

  clang-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libssl-dev

      - name: Configure
        run: |
          CC=clang CXX=clang++ cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure -L "unit|contract" --timeout 60

  tsan-threading-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libssl-dev

      - name: Configure
        run: |
          CC=clang CXX=clang++ cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DMINI_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test threading and coroutine contracts
        run: ctest --test-dir build --output-on-failure -L "threading|coro" --timeout 120

  fuzz-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang libssl-dev

      - name: Configure
        run: |
          CC=clang CXX=clang++ cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF \
            -DMINI_ENABLE_FUZZ=ON

      - name: Build fuzz targets
        run: cmake --build build -j$(nproc)

      - name: Fuzz smoke
        run: |
          ./build/tests/fuzz/fuzz_http_context -runs=100
          ./build/tests/fuzz/fuzz_ws_codec -runs=100
          ./build/tests/fuzz/fuzz_rpc_codec -runs=100
          ./build/tests/fuzz/fuzz_packet_framer -runs=100

  install-verify:
    runs-on: ubuntu-latest
    needs:
      - gcc-debug-asan-ubsan
      - gcc-release
      - clang-debug
      - tsan-threading-contract
      - fuzz-build

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libssl-dev

      - name: Build and install
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc)
          cmake --install build --prefix ./_install

      - name: Verify find_package consumption
        run: |
          cat > /tmp/consumer.cpp << 'EOF'
          #include "mini/coroutine/Task.h"
          #include "mini/coroutine/Timeout.h"
          #include "mini/game/GameServerPipeline.h"
          #include "mini/http/HttpClient.h"
          #include "mini/http/HttpServer.h"
          #include "mini/net/EventLoop.h"
          #include "mini/net/TcpClient.h"
          #include "mini/net/TcpServer.h"
          #include "mini/rpc/RpcClient.h"
          #include "mini/rpc/RpcServer.h"
          #include "mini/ws/WebSocketServer.h"

          int main() {
              mini::net::EventLoop loop;
              mini::net::InetAddress addr(0, true);
              mini::net::TcpServer server(&loop, addr, "verify");
              return 0;
          }
          EOF

          cat > /tmp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          find_package(mini_trantor CONFIG REQUIRED)
          add_executable(consumer /tmp/consumer.cpp)
          target_link_libraries(consumer PRIVATE mini_trantor::mini_trantor)
          EOF

          cmake -S /tmp -B /tmp/build_consumer \
            -DCMAKE_PREFIX_PATH=$PWD/_install \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/build_consumer -j$(nproc)
          echo "Install verification: PASS"
